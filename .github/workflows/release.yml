name: Build and release

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run zip

      # The tag must match the manifest, or the store rejects the upload as a duplicate version.
      - name: Check tag matches manifest version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          manifest=$(node -p "require('./public/manifest.json').version")
          [ "v$manifest" = "$GITHUB_REF_NAME" ] || { echo "Tag $GITHUB_REF_NAME does not match manifest $manifest"; exit 1; }

      - uses: actions/upload-artifact@v4
        with:
          name: youtube-study-bookmarks
          path: youtube-study-bookmarks.zip

      - name: Attach zip to GitHub release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" youtube-study-bookmarks.zip --title "$GITHUB_REF_NAME" --generate-notes
