name: Bug report
description: Something isn't working as expected
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: What did you do, what did you expect, and what happened instead?
    validations:
      required: true
  - type: input
    id: video
    attributes:
      label: YouTube video link
      description: A video where it happens, if it's video-specific.
  - type: input
    id: versions
    attributes:
      label: Extension and Chrome version
      placeholder: "Extension 1.0.0, Chrome 141"
